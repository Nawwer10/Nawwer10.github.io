<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое Музыкальное Портфолио</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f0f0f;
            color: #fff;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 700px;
            width: 100%;
        }
        h1 {
            font-size: 2.5rem;
            border-bottom: 3px solid #1db954;
            padding-bottom: 10px;
        }
        .track {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            transition: 0.2s;
            border-left: 4px solid #1db954;
        }
        .track:hover {
            background: #2a2a2a;
        }
        .track h3 {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
        }
        .track p {
            margin: 0 0 12px 0;
            color: #aaa;
            font-size: 0.9rem;
        }
        audio {
            width: 100%;
            height: 40px;
            border-radius: 8px;
        }
        .bio {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        a {
            color: #1db954;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎧 Имя Артиста</h1>
        
        <div class="bio">
            <p>Привет! Я создаю музыку в жанрах [твой жанр]. Здесь собраны мои последние работы. 
            Связь: <a href="mailto:твоя@почта.com">твоя@почта.com</a></p>
        </div>

        <!-- Трек 1 -->
        <div class="track">
            <h3>Название трека 1</h3>
            <p>Описание: что за трек, фит, идея</p>
            <audio controls>
                <source src="music/trek1.mp3" type="audio/mpeg">
                Твой браузер не поддерживает аудио.
            </audio>
        </div>

        <!-- Трек 2 -->
        <div class="track">
            <h3>Название трека 2</h3>
            <p>Описание: например, "Инструментал, 2026"</p>
            <audio controls>
                <source src="music/trek2.mp3" type="audio/mpeg">
                Твой браузер не поддерживает аудио.
            </audio>
        </div>

        <!-- Добавь так же трек 3, 4... -->

        <p style="text-align:center; margin-top: 40px; color: #555;">
            ⚡ Сделано на GitHub Pages
        </p>
    </div>
</body>
</html>
