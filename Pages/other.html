<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>• Other Music •</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f0f0f;
            color: #fff;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 700px;
            width: 100%;
        }
        .back {
            color: #436be0;
            text-decoration: none;
            font-size: 1rem;
            display: inline-block;
            margin-bottom: 16px;
        }
        .back:hover {
            text-decoration: underline;
        }
        h1 {
            font-size: 2.5rem;
            border-bottom: 3px solid #436be0;
            padding-bottom: 10px;
        }
        .track {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            transition: 0.2s;
            border-left: 4px solid #436be0;
        }
        .track:hover {
            background: #2a2a2a;
        }
        .track h3 {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
        }
        .track p {
            margin: 0 0 12px 0;
            color: #aaa;
            font-size: 0.9rem;
        }
        audio {
            width: 100%;
            height: 40px;
            border-radius: 8px;
        }
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: #ffffff;
        }
        a {
            color: #436be0;
            text-decoration: none;
        }
        a:hover {
            color: #4a6f8a;
            text-decoration: underline;
        }
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back">← Back to home</a>
        <h1>Other Music</h1>
        <p style="color: #aaa; margin-bottom: 24px;">My personal experiments and favorites</p>

        <div class="track">
            <h3>Night</h3>
            <p>This is one of my favourite track</p>
            <audio controls>
                <source src="../Music/Other/Mathieu - Night.mp3" type="audio/mpeg">
                Your browser does not support audio.
            </audio>
        </div>

        <div class="track">
            <h3>~Track without name~</h3>
            <p>This is one of my very first experiments</p>
            <audio controls>
                <source src="../Music/Other/Mathieu - _Track without name_.mp3" type="audio/mpeg">
                Your browser does not support audio.
            </audio>
        </div>

        <div class="track">
            <h3>~Another track without name~</h3>
            <p>And this one too</p>
            <audio controls>
                <source src="../Music/Other/Mathieu - _Second track without name_.mp3" type="audio/mpeg">
                Your browser does not support audio.
            </audio>
        </div>

        <div class="footer">Made on GitHub Pages</div>
    </div>
</body>
</html>
